<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FSRCNN Web Upscaler</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video, canvas { border: 1px solid #555; max-width: 45%; background: black; }
        h3 { color: #aaa; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>FSRCNN 실시간 업스케일링 (ONNX)</h1>
    <p>아래 버튼을 눌러 비디오 파일(.mp4)을 선택하세요.</p>
    <input type="file" id="uploadInput" accept="video/*">
    
    <div class="container">
        <div>
            <h3>원본 (Input)</h3>
            <video id="inputVideo" loop muted playsinline controls width="320"></video>
        </div>
        <div>
            <h3>AI 결과물 (2x Output)</h3>
            <canvas id="outputCanvas"></canvas>
        </div>
    </div>

    <script>
        let session;
        const video = document.getElementById('inputVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');

        async function loadModel() {
            try {
                console.log("⏳ 모델 로딩 중...");
                // WebGL이 안 되면 자동으로 WASM(CPU)으로 넘어갑니다.
                session = await ort.InferenceSession.create('./fsrcnn.onnx', { 
                    executionProviders: ['webgl', 'wasm'] 
                });
                console.log("✅ 모델 로드 완료!");
                alert("모델 준비 완료! 비디오를 선택하세요.");
            } catch (e) {
                console.error("모델 로드 실패:", e);
                alert("모델 로드 실패! 콘솔을 확인하세요.");
            }
        }

        loadModel();

        document.getElementById('uploadInput').onchange = function(event) {
            const file = event.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                video.src = url;
                video.play();
            }
        };

        video.addEventListener('play', () => {
            const processFrame = async () => {
                if (video.paused || video.ended) return;

                // [수정된 부분] 중요! 비디오 크기가 0이면 아직 로딩 안 된 것이므로 대기
                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    requestAnimationFrame(processFrame);
                    return;
                }

                // (1) 전처리
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0);
                
                const imgData = tempCtx.getImageData(0, 0, video.videoWidth, video.videoHeight);
                const float32Data = new Float32Array(imgData.data.length / 4 * 3); 

                let j = 0;
                for (let i = 0; i < imgData.data.length; i += 4) {
                    float32Data[j++] = imgData.data[i] / 255.0;
                    float32Data[j++] = imgData.data[i + 1] / 255.0;
                    float32Data[j++] = imgData.data[i + 2] / 255.0;
                }

                const inputTensor = new ort.Tensor('float32', float32Data, [1, video.videoHeight, video.videoWidth, 3]);

                // (2) 추론
                try {
                    const feeds = { input_image: inputTensor };
                    const results = await session.run(feeds);
                    const outputTensor = results.output_image;

                    // (3) 후처리
                    const outH = outputTensor.dims[1];
                    const outW = outputTensor.dims[2];
                    if (canvas.width !== outW) { canvas.width = outW; canvas.height = outH; }

                    const outData = outputTensor.data;
                    const outImgData = ctx.createImageData(outW, outH);

                    j = 0;
                    for (let i = 0; i < outData.length; i += 3) {
                        outImgData.data[j++] = Math.min(255, Math.max(0, outData[i] * 255));
                        outImgData.data[j++] = Math.min(255, Math.max(0, outData[i + 1] * 255));
                        outImgData.data[j++] = Math.min(255, Math.max(0, outData[i + 2] * 255));
                        outImgData.data[j++] = 255; 
                    }
                    ctx.putImageData(outImgData, 0, 0);
                } catch (err) {
                    console.error("추론 에러:", err);
                }

                requestAnimationFrame(processFrame);
            };
            processFrame();
        });
    </script>
</body>
</html>
