<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cloud Gaming Server</title>
    <style>
        body { background-color: #111; color: white; text-align: center; }
        video { width: 90%; max-width: 1280px; border: 2px solid #444; }
        button { padding: 10px 20px; font-size: 1.2em; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Remote Desktop Streaming</h2>
    <video id="video" autoplay playsinline></video>
    <br/><br/>
    <button id="start" onclick="start()">Start Streaming</button>

    <script>
        const pc = new RTCPeerConnection();

        // 서버에서 비디오 트랙이 오면 화면에 표시
        pc.ontrack = function (evt) {
            if (evt.track.kind === 'video') {
                document.getElementById('video').srcObject = evt.streams[0];
            }
        };

        async function start() {
            document.getElementById('start').style.display = 'none';

            // 1. 비디오 수신 전용 트랜시버 추가
            pc.addTransceiver('video', {direction: 'recvonly'});

            // 2. Offer 생성 (나 연결하고 싶어!)
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // 3. 서버에 Offer 전송 및 Answer 수신
            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                })
            });

            // 4. 서버의 응답(Answer) 적용 -> 연결 수립
            const answer = await response.json();
            await pc.setRemoteDescription(answer);
        }
    </script>
</body>
</html>
