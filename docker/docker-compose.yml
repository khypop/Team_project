version: '3.8'

services:
  # 우리가 만든 FastAPI 앱
  app:
    build: .
    container_name: fast-api-app
    restart: always

  # 클라우드플레어 터널 (외부 통로)
  tunnel:
    image: cloudflare/cloudflared
    container_name: cf-tunnel
    restart: always
    # 임시 주소를 생성하여 우리 앱(8000포트)에 연결합니다.
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app