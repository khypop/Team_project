<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteConnect - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .tv-blue { background-color: #0059b3; }
        .sidebar-anim { transition: transform 0.3s ease-in-out; }
        .modal-anim { transition: all 0.2s ease-out; }
    </style>
</head>
<body class="bg-[#0a0f1a] text-white overflow-hidden">

    <header class="fixed top-0 left-0 right-0 h-16 bg-[#0a0f1a]/80 backdrop-blur-md flex items-center px-6 z-40 border-b border-white/5">
        <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
            <i data-lucide="menu" class="w-6 h-6 text-white"></i>
        </button>
        <span class="ml-4 font-bold tracking-tight text-blue-400 uppercase text-sm tracking-widest">RemoteConnect</span>
    </header>

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-[#161e2e] z-50 sidebar-anim -translate-x-full shadow-2xl flex flex-col">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <span class="font-bold text-lg text-blue-400">메뉴</span>
            <button onclick="toggleSidebar()" class="p-1 hover:bg-white/10 rounded-md">
                <i data-lucide="x" class="w-5 h-5 text-slate-400"></i>
            </button>
        </div>

        <div class="p-6 bg-white/5 mx-4 mt-6 rounded-2xl border border-white/5">
            <div id="auth-logged-out" class="space-y-4">
                <p class="text-xs text-slate-400 leading-relaxed">원격 제어 서비스를 이용하시려면 로그인이 필요합니다.</p>
                <div class="grid grid-cols-1 gap-2">
    <a href="/login" class="w-full py-2.5 bg-blue-600 rounded-xl text-xs font-bold hover:bg-blue-500 transition-all text-center">로그인</a>
    <a href="/register" class="w-full py-2.5 bg-slate-700 rounded-xl text-xs font-bold hover:bg-slate-600 transition-all text-center">회원가입</a>
		</div>
            </div>
        </div>

        <nav class="p-4 space-y-1 mt-4">
            <div class="flex items-center space-x-3 p-3 text-slate-400 hover:bg-white/5 rounded-xl cursor-pointer">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="text-sm font-medium">대시보드</span>
            </div>
            <div class="flex items-center space-x-3 p-3 text-slate-400 hover:bg-white/5 rounded-xl cursor-pointer text-slate-600 italic">
                <i data-lucide="lock" class="w-4 h-4"></i>
                <span class="text-sm">설정 (잠김)</span>
            </div>
        </nav>
    </aside>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div id="auth-modal" class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl scale-95 opacity-0 modal-anim">
            
            <div class="tv-blue p-8 text-center relative">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white/50 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                <h2 id="modal-title" class="text-2xl font-bold text-white">로그인</h2>
                <p id="modal-desc" class="text-blue-100/60 text-xs mt-1">RemoteConnect 계정으로 계속합니다.</p>
            </div>

            <form id="auth-form" class="p-8 space-y-4 text-gray-800">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5 ml-1">Username</label>
                    <input type="text" placeholder="아이디를 입력하세요" class="w-full px-4 py-3 bg-gray-100 border-transparent focus:bg-white focus:ring-2 focus:ring-blue-600 rounded-xl outline-none transition-all text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5 ml-1">Password</label>
                    <input type="password" placeholder="비밀번호" class="w-full px-4 py-3 bg-gray-100 border-transparent focus:bg-white focus:ring-2 focus:ring-blue-600 rounded-xl outline-none transition-all text-sm">
                </div>
                
                <button type="button" onclick="handleAuth()" class="w-full tv-blue py-4 text-white font-bold rounded-xl shadow-lg shadow-blue-200 mt-4 active:scale-[0.98] transition-all">
                    확인
                </button>

                <p class="text-center text-xs text-gray-400 mt-4">
                    <span id="switch-text">계정이 없으신가요?</span>
                    <button type="button" onclick="switchMode()" id="switch-btn" class="text-blue-600 font-bold ml-1 hover:underline">회원가입</button>
                </p>
            </form>
        </div>
    </div>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[45] hidden opacity-0 transition-opacity duration-300"></div>

    <main class="flex items-center justify-center min-h-screen pt-16">
        <div class="w-full max-w-sm bg-white rounded-[2.5rem] shadow-2xl overflow-hidden text-gray-800 mx-4 border border-white/10">
            <div class="tv-blue p-12 text-center">
                <div class="w-20 h-20 bg-white/10 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-white/20 rotate-3">
                    <i data-lucide="zap" class="w-10 h-10 text-white fill-white"></i>
                </div>
                <h1 class="text-2xl font-black text-white tracking-tight">원격제어 시작</h1>
                <div class="mt-2 inline-block px-3 py-1 bg-black/20 rounded-full">
                    <span class="text-[10px] text-blue-200 font-bold uppercase tracking-widest">Device: onlygst</span>
                </div>
            </div>

            <div class="p-10">
                <button onclick="bootPC()" class="tv-blue w-full text-white font-bold py-5 rounded-2xl transition-all shadow-xl shadow-blue-200 flex items-center justify-center space-x-3 active:scale-95">
                    <span>Power On System</span>
                </button>
                <div id="status-container" class="mt-6 hidden">
                    <div class="py-3 px-4 bg-blue-50 border border-blue-100 rounded-xl text-center">
                        <p id="result" class="text-xs font-bold text-blue-600"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // 사이드바 제어
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = !sidebar.classList.contains('-translate-x-full');

            if (!isOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // 모달 제어
        let currentMode = 'login';
        function openModal(mode) {
            currentMode = mode;
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById('auth-modal');
            updateModalUI();
            
            overlay.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('scale-95', 'opacity-0');
                modal.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById('auth-modal');
            modal.classList.add('scale-95', 'opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 200);
        }

        function switchMode() {
            currentMode = (currentMode === 'login') ? 'register' : 'login';
            updateModalUI();
        }

        function updateModalUI() {
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const switchText = document.getElementById('switch-text');
            const switchBtn = document.getElementById('switch-btn');

            if (currentMode === 'login') {
                title.innerText = "로그인";
                desc.innerText = "RemoteConnect 계정으로 계속합니다.";
                switchText.innerText = "계정이 없으신가요?";
                switchBtn.innerText = "회원가입";
            } else {
                title.innerText = "회원가입";
                desc.innerText = "새로운 계정을 생성합니다.";
                switchText.innerText = "이미 계정이 있으신가요?";
                switchBtn.innerText = "로그인";
            }
        }

        // 실제 인증 처리 (현재는 닫기만 함)
        function handleAuth() {
            alert(currentMode === 'login' ? "로그인 시도!" : "회원가입 시도!");
            closeModal();
            toggleSidebar();
        }

        async function bootPC() {
            const result = document.getElementById('result');
            const container = document.getElementById('status-container');
            result.innerText = "매직 패킷 전송 중...";
            container.classList.remove('hidden');
            try {
                const res = await fetch('/wakeup', { method: 'POST' });
                const data = await res.json();
                result.innerText = data.message;
            } catch (e) { result.innerText = "서버 에러 발생"; }
        }
    </script>
</body>
</html>
