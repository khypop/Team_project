<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteConnect | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0f1a; }
        .tv-blue { background-color: #0059b3; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden text-gray-800">
        <div class="tv-blue p-10 text-center text-white">
            <h1 class="text-3xl font-black tracking-tighter mb-2">RemoteConnect</h1>
            <p class="text-blue-100/60 text-xs uppercase tracking-widest font-bold">Sign In to Dashboard</p>
        </div>
        
        <form action="/login" method="post" class="p-10 space-y-5">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2 ml-1">Username</label>
                <input type="text" name="username" placeholder="아이디" required
                    class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm">
            </div>
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2 ml-1">Password</label>
                <input type="password" name="password" placeholder="비밀번호" required
                    class="w-full px-5 py-4 bg-gray-50 border border-gray-100 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm">
            </div>
            
            <button type="submit" class="tv-blue w-full text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-200 mt-4 active:scale-95 transition-all">
                로그인하기
            </button>

            <p class="text-center text-sm text-gray-500 mt-6">
                계정이 없으신가요? <a href="/register" class="text-blue-600 font-bold hover:underline">회원가입</a>
            </p>
            <div class="text-center">
                <a href="/" class="text-xs text-gray-300 hover:text-gray-500 transition-colors">홈으로 돌아가기</a>
            </div>
        </form>
    </div>
</body>
</html>
